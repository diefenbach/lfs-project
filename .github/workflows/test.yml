# Runs the template's tests on every push to main and every pull request.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # The settings refuse to start without a secret key unless DEBUG is on.
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        # Everything from PyPI, as a new shop installs it.
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: .venv/bin/python -m pytest
